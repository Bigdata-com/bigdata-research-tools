[project]
name = "bigdata-research-tools"
version = "1.1.0"
description = "Bigdata.com API High-Efficiency Tools at Scale"
readme = "README.md"
authors = [{ name = "Bigdata.com", email = "support@ravenpack.com" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "bigdata-client>=2.19.0",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pillow>=11.1.0,<12.0.0",
    "graphviz>=0.20.3,<0.21.0",
    "tqdm>=4.67.1",
    "json-repair>=0.44.1",
    "tabulate>=0.9.0,<1.0.0",
    "plotly>=6.0.0,<7.0.0",
    "matplotlib>=3.10.6,<4.0.0"
]

[project.urls]
homepage = "https://bigdata.com/api"

[project.optional-dependencies]
openai = ["openai>=1.61.1,<2.0.0"]
bedrock = ["boto3>=1.24.0,<2.0.0"]
azure = [
    "azure-identity>=1.24.0",
    "openai>=1.61.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pre-commit>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
